##
## Pisti SaaS — Laravel Horizon Supervisor Configuration
## File: /etc/supervisor/conf.d/pisti-horizon.conf
##
## This keeps Horizon running as a daemon and auto-restarts it on failure.
##
## Setup:
##   1. Copy this file to /etc/supervisor/conf.d/pisti-horizon.conf
##   2. sudo supervisorctl reread
##   3. sudo supervisorctl update
##   4. sudo supervisorctl start pisti-horizon:*
##
## Commands:
##   sudo supervisorctl status pisti-horizon:*
##   sudo supervisorctl restart pisti-horizon:*
##   sudo supervisorctl stop pisti-horizon:*
##

[program:pisti-horizon]
processname=%(program_name)s_%(process_num)02d
command=php /var/www/pisti/artisan horizon
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pisti/storage/logs/horizon.log
stopwaitsecs=3600
