##
## Pisti SaaS — Nginx Wildcard Subdomain Configuration
## File: /etc/nginx/sites-available/pisti
##
## This single server block handles ALL tenant subdomains:
##   churchname.pisti.co.ke   → tenant dashboard
##   www.pisti.co.ke          → marketing site
##   admin.pisti.co.ke        → superadmin panel
##   api.pisti.co.ke          → REST API (future)
##
## Prerequisites:
##   1. Wildcard SSL cert at /etc/letsencrypt/live/pisti.co.ke/
##   2. Link this file: ln -s /etc/nginx/sites-available/pisti /etc/nginx/sites-enabled/pisti
##   3. Test config: nginx -t
##   4. Reload: systemctl reload nginx
##

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name *.pisti.co.ke pisti.co.ke;
    return 301 https://$host$request_uri;
}

# Main HTTPS server — handles all subdomains
server {
    listen 443 ssl http2;
    server_name *.pisti.co.ke pisti.co.ke;

    # Wildcard SSL certificate (obtained via: ./infra/ssl-wildcard.sh)
    ssl_certificate     /etc/letsencrypt/live/pisti.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pisti.co.ke/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Document root
    root /var/www/pisti/public;
    index index.php;

    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Horizon dashboard — restrict to superadmin IP or add basic auth
    location /horizon {
        # Optional: restrict to trusted IPs only
        # allow 41.90.0.0/16;  # your office IP range
        # deny all;

        # Basic auth as additional layer (username/password in .env as HORIZON_USERNAME/HORIZON_PASSWORD)
        auth_basic "Pisti Horizon";
        auth_basic_user_file /etc/nginx/.pisti-horizon-htpasswd;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel app
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # adjust PHP version
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;  # long timeout for tenant provisioning jobs
    }

    # Block access to sensitive files
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Mpesa callback endpoint — bypass basic auth if applied elsewhere
    location /api/transaction/ {
        auth_basic off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    access_log /var/log/nginx/pisti-access.log;
    error_log  /var/log/nginx/pisti-error.log;
}
